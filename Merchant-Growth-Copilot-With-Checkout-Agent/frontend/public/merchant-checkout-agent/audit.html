<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merchant Checkout Agent · Audit Trail</title><style>body{margin:0;background:#07111f;color:#eef6ff;font-family:Inter,system-ui,Arial}.wrap{max-width:1000px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.title{font-size:25px;font-weight:950}.muted{color:#8fa8c2;font-size:11px}.btn{background:#172c45;border:1px solid #2a4564;color:#dbeafe;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.event{background:#0d1b2e;border:1px solid #203753;border-radius:14px;padding:14px;margin:8px 0}.type{font-size:9px;letter-spacing:1px;color:#60a5fa;font-weight:950}.msg{font-size:12px;margin-top:5px}.time{font-size:9px;color:#6f89a3;margin-top:7px}.meta{margin-top:8px;padding:8px;background:#081726;border-radius:8px;color:#8fa8c2;font-size:10px;white-space:pre-wrap}</style></head><body><div class="wrap"><div class="top"><div><div class="title">Audit Trail</div><div class="muted">Every AI request, policy gate, approval, Razorpay order and verification event.</div></div><div><button class="btn" onclick="location.href='/merchant-checkout-agent/'">← Checkout Agent</button> <button class="btn" onclick="clearAudit()">Clear Demo</button></div></div><div id="events"></div></div><script>const API='http://localhost:5001/api';async function load(){try{const d=await fetch(API+'/audit').then(r=>r.json());document.getElementById('events').innerHTML=(d.events||[]).map(e=>`<div class="event"><div class="type">${e.type}</div><div class="msg">${e.message}</div><div class="time">${new Date(e.timestamp).toLocaleString()}</div>${e.meta&&Object.keys(e.meta).length?`<div class="meta">${JSON.stringify(e.meta,null,2)}</div>`:''}</div>`).join('')||'<div class="muted">No audit events.</div>'}catch(e){document.getElementById('events').innerHTML='<div class="muted">Backend is offline. Start the backend first.</div>'}}async function clearAudit(){if(confirm('Clear the demo audit trail?')){await fetch(API+'/audit/clear',{method:'POST'});load()}}load();setInterval(load,2500)</script></body></html>
